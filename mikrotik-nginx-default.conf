server {
    listen 80;
    server_name securesmith.net;

    # Pass ACME renewals back to RouterOS on port 8080
    location /.well-known/acme-challenge/ {
        proxy_pass http://192.168.1.1:8080;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name openclaw.securesmith.net;

    ssl_password_file   /etc/nginx/conf.d/global_ssl_password.txt;
    ssl_certificate     /etc/nginx/certs/securesmith.net.crt;
    ssl_certificate_key /etc/nginx/certs/securesmith.net.key;

    location / {
        proxy_pass https://192.168.1.60:443/;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

