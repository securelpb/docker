x-vllm-common: &vllm-common
  restart: unless-stopped
  image: vllm/vllm-openai:latest
  ipc: host
  ulimits:
    memlock: -1
    stack: 67108864
  ports:
    - "8000:8000"
  volumes:
    - huggingface_cache:/home/vllm/.cache/huggingface
  environment:
    HF_TOKEN: ${HF_TOKEN:?HF_TOKEN is not set. Please define it in a .env file.}
    VLLM_API_KEY: ${VLLM_API_KEY:-}
    PYTORCH_ALLOC_CONF: "expandable_segments:True"
    PYTHONWARNINGS: "ignore:The .use_fast. parameter is deprecated:UserWarning"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  vllm-qwen:
    <<: *vllm-common
    container_name: vllm-qwen
    profiles: ["qwen"]
    command: >
      python3 -m vllm.entrypoints.openai.api_server
      --model Lorbus/Qwen3.6-27B-int4-AutoRound
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --max-model-len 65536
      --gpu-memory-utilization 0.95
      --max-num-seqs 2
      --kv-cache-dtype fp8
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
      --no-enable-log-requests
      ${VLLM_API_KEY:+--api-key $VLLM_API_KEY}

  vllm-gemma:
    <<: *vllm-common
    container_name: vllm-gemma26b
    profiles: ["gemma26b"]
    command: >
      python3 -m vllm.entrypoints.openai.api_server
      --model cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit 
      --quantization compressed-tensors 
      --host 0.0.0.0 
      --port 8000 
      --max-model-len 65536 
      --dtype float16 
      --kv-cache-dtype bfloat16 
      --max-num-seqs 1 
      --gpu-memory-utilization 0.95 
      --no-enable-log-requests
      ${VLLM_API_KEY:+--api-key $VLLM_API_KEY}

  vllm-gemma12b:
    <<: *vllm-common
    container_name: vllm-gemma12b
    profiles: ["gemma12b"]
    command: >
      python3 -m vllm.entrypoints.openai.api_server
      --model securelpb/gemma-4-12B-agentic-W4A16
      --quantization compressed-tensors 
      --host 0.0.0.0 
      --port 8000
      --trust-remote-code
      --dtype bfloat16 
      --kv-cache-dtype bfloat16 
      --max-model-len 82000
      --max-num-seqs 1 
      --gpu-memory-utilization 0.95 
      --no-enable-log-requests
      --enable-auto-tool-choice
      --tool-call-parser gemma4
      --enable-prefix-caching
      --disable_chunked_mm_input
      ${VLLM_API_KEY:+--api-key $VLLM_API_KEY}

  vllm-qwen-long-context:
    <<: *vllm-common
    container_name: vllm-qwen-long-context
    profiles: ["qwen-long-context"]
    command: >
      python3 -m vllm.entrypoints.openai.api_server
      --model Lorbus/Qwen3.6-27B-int4-AutoRound
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --max-model-len 76832
      --gpu-memory-utilization 0.96
      --max-num-seqs 2
      --kv-cache-dtype fp8
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
      --no-enable-log-requests
      ${VLLM_API_KEY:+--api-key $VLLM_API_KEY}

  vllm-coder-14b:
    <<: *vllm-common
    container_name: vllm-coder-14b
    profiles: ["coder"]
    command: >
      python3 -m vllm.entrypoints.openai.api_server
      --model Qwen/Qwen2.5-Coder-14B-Instruct-AWQ
      --quantization awq
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --max-model-len 32768
      --gpu-memory-utilization 0.95
      --max-num-seqs 3
      --kv-cache-dtype fp8
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --no-enable-log-requests
      ${VLLM_API_KEY:+--api-key $VLLM_API_KEY}

  vllm-llama:
    <<: *vllm-common
    container_name: vllm-llama
    profiles: ["llama"]
    command: >
      python3 -m vllm.entrypoints.openai.api_server
      --model yw223/Meta-Llama-3.1-8B-Instruct-AWQ-4bit
      --quantization compressed-tensors
      --host 0.0.0.0
      --port 8000
      --max-model-len 131072
      --gpu-memory-utilization 0.95
      --max-num-seqs 1
      --kv-cache-dtype fp8
      --no-enable-log-requests
      ${VLLM_API_KEY:+--api-key $VLLM_API_KEY}

volumes:
  huggingface_cache:
    driver: local
    driver_opts:
      type: none
      device: /home/alex/docker_server_data/huggingface_cache
      o: bind