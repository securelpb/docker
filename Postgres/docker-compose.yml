services:
  postgres:
    build:
      context: .
      args:
        UID: ${UID}
        GID: ${GID}
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POWER_USER: ${POWER_USER}
      POWER_USER_PASSWORD: ${POWER_USER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /home/alex/docker_server_data/postgres:/var/lib/postgresql
      - ./init-power-user.sh:/docker-entrypoint-initdb.d/init-power-user.sh
    ports:
      - "5432:5432"
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  postgrest:
    image: postgrest/postgrest:latest
    container_name: postgrest-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://postgrest_anon:AnonPassword123@postgres:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: postgrest_anon
    depends_on:
      postgres:
        condition: service_healthy