user  nginx;
worker_processes  auto;

error_log /dev/stdout error;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
    worker_aio_requests 0;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Disable Linux AIO for RouterOS Linux Kernel 5.6.3 compatibility
    aio off;

    # Increase hash bucket size for multi-subdomain configurations
    server_names_hash_bucket_size 64;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # Exclude static assets and periodic polling from access logs
    #map $request_uri $loggable {
    #    ~*\.(css|js|png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2|json|)$ 0;
    #    default 1;
    #}

    # Map HTTP status codes starting with 4 or 5 to 1 (loggable), others to 0
    map $status $loggable_error {
        ~^[45]  1;
        default 0;
    }

    # Send only 4xx/5xx requests to STDOUT
    access_log /dev/stdout main if=$loggable_error;

    sendfile        off;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}