services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      # A clean, dedicated persistent volume strictly for Ollama's GGUF blobs
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=-1
      # Allows Ollama to pull gated models directly from Hugging Face
      - HF_TOKEN=${HF_TOKEN:?HF_TOKEN is not set. Please define it in a .env file.}
      - LLAMA_N_CTX=32768 # Aligning with the updated num_ctx in Modelfiles
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  ollama-pull-models:
    image: ollama/ollama:latest
    container_name: ollama_pull_models
    volumes:
      - ollama_data:/root/.ollama
      - ./Modelfile.qwen38-unsloth:/Modelfile.qwen38-unsloth # Mount the Modelfile for qwen38-unsloth
      - ./Modelfile.qwen3-VL-abliterated:/Modelfile.qwen3-VL-abliterated# Mount the Modelfile for qwen38-obliterated
    environment:
      - OLLAMA_HOST=ollama:11434 # Ensure the pull service connects to the ollama service
    entrypoint: /bin/sh
    command: >
      -c "
      echo 'Waiting for Ollama service to start...';
      until ollama list > /dev/null 2>&1; do
        sleep 2;
      done;
      echo 'Ollama service is up. Creating custom models...';
      
      echo 'Creating model: qwen38-unsloth from /Modelfile.qwen38-unsloth';
      ollama create qwen38-unsloth -f /Modelfile.qwen38-unsloth;
      
      echo 'Creating model: qwen3-VL-abliterated from /Modelfile.qwen3-VL-abliterated';
      ollama create qwen3-VL-abliterated -f /Modelfile.qwen3-VL-abliterated;
      
      echo 'All custom models successfully created!';
      ollama list; # List models after creation attempts
      "
    depends_on:
      - ollama

volumes:
  ollama_data:
    driver: local
    driver_opts:
      type: none
      # Your clean convention path! Make sure this folder exists on Art.lan before running.
      device: /home/alex/docker_server_data/ollama
      o: bind