server {
    listen 443 ssl;
    server_name openclaw.securesmith.net;

    ssl_password_file /run/secrets/ssl_cert_passphrase;
    ssl_certificate /etc/nginx/certs/securesmith.net.crt;
    ssl_certificate_key /etc/nginx/certs/securesmith.net.key;

    location / {
        proxy_pass http://openclaw-gateway:18789;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
