server {
    listen 443 ssl;
    server_name openclaw.securesmith.net;

    ssl_password_file /run/secrets/ssl_cert_passphrase;
    ssl_certificate /etc/nginx/certs/securesmith.net.crt;
    ssl_certificate_key /etc/nginx/certs/securesmith.net.key;

    location / {
        # Resolve the gateway per request via Docker's embedded DNS so nginx
        # starts even if the gateway isn't up yet (returns 502 until it is)
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $openclaw_upstream http://openclaw-gateway:18789;
        proxy_pass $openclaw_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
