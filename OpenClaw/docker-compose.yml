services:
  openclaw-gateway:
    build: .
    image: custom-openclaw:latest
    container_name: openclaw-gateway
    hostname: openclaw-gateway
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENCLAW_GATEWAY_BIND: lan
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN is not set. Please define it in a .env file.}
      GEMINI_API_KEY : ${GEMINI_API_KEY:?GEMINI_API_KEY is not set. Please define it in a .env file.}
      GOOGLE_CLOUD_PROJECT : ${GOOGLE_CLOUD_PROJECT:?GOOGLE_CLOUD_PROJECT is not set. Please define it in a .env file.}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is not set. Please define it in a .env file.}
      VLLM_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY is not set. Please define it in a .env file.}
      VLLM_BASE_URL: ${VLLM_BASE_URL:?VLLM_BASE_URL is not set. Please define it in a .env file.}
      OPENCLAW_SKILLS_PATHS: ${OPENCLAW_SKILLS_PATHS:?OPENCLAW_SKILLS_PATHS is not set. Please define it in a .env file.}
    command: openclaw gateway --allow-unconfigured
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_auth:/home/node/.config/openclaw
      - openclaw_ssh:/home/node/.ssh
      - openclaw_data:/home/node/local
      - openclaw_go:/home/node/go
    networks:
      openclaw_net:
        ipv4_address: 172.20.0.10

  openclaw-proxy:
    image: nginx:latest
    container_name: openclaw-proxy
    hostname: openclaw-proxy
    ports:
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/local/nginx/certs:/etc/nginx/certs:ro
    secrets:
      - ssl_cert_passphrase
    depends_on:
      - openclaw-gateway
    networks:
      openclaw_net:
        ipv4_address: 172.20.0.20

networks:
  openclaw_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  openclaw_config:
    driver: local
    driver_opts:
      type: none
      device: /home/alex/docker_server_data/openclaw_config
      o: bind
  openclaw_auth:
    driver: local
    driver_opts:
      type: none
      device: /home/alex/docker_server_data/openclaw_auth
      o: bind
  openclaw_ssh:
    driver: local
    driver_opts:
      type: none
      device: /home/alex/docker_server_data/openclaw_auth/.ssh
      o: bind
  openclaw_data:
    driver: local
    driver_opts:
      type: none
      device: /home/alex/docker_server_data/openclaw_data
      o: bind
  openclaw_go:
    driver: local
    driver_opts:
      type: none
      device: /home/alex/docker_server_data/openclaw_go
      o: bind

secrets:
  ssl_cert_passphrase:
    file: /etc/ssl/private/ssl_passphrase.txt