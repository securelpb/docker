x-jupyter-base: &jupyter-base
  ipc: host
  ulimits:
    memlock: -1
    stack: 67108864
  volumes:
    - src:/home/jovyan/work
    - gdrive:/home/jovyan/gdrive
    - jupyter_config:/home/jovyan/.jupyter
    - huggingface_cache:/home/jovyan/.cache/huggingface
    - jetbrains-backend-cache:/home/jovyan/.cache/JetBrains
  environment: &common-env
    JUPYTER_TOKEN: ${JUPYTER_TOKEN:?JUPYTER_TOKEN is not set. Please define it in a .env file.}
    HF_TOKEN: ${HF_TOKEN:?HF_TOKEN is not set. Please define it in a .env file.}
    GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    PYTHONPATH: /home/jovyan/work/jupyterlab
    SETUPTOOLS_USE_DISTUTILS: stdlib
    PYTHONWARNINGS: ignore
  deploy:
    resources:
      limits:
        memory: 42G
      reservations:
        memory: 10G
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # The Master PyTorch Environment
  jupyterlab:
    <<: *jupyter-base
    restart: unless-stopped
    build:
      context: .
      dockerfile: jupyterlab/Dockerfile
    image: custom-jupyter-pytorch:latest
    container_name: jupyterlab
    hostname: jupyterlab
    ports:
      - "2222:22" # Open 22 to sshd
      # Note: Port 8888 mapping removed; handled by Nginx proxy
    command: jupyter lab --port=8888 --no-browser --ip=0.0.0.0 --notebook-dir=/home/jovyan --ServerApp.allow_origin='*'

  # CPU-Only TensorBoard (Crash-proof and VRAM efficient)
  tensorboard:
    image: custom-jupyter-pytorch:latest
    restart: unless-stopped
    container_name: tensorboard
    depends_on:
      - jupyterlab
    command: tensorboard --logdir /home/jovyan/work/logs/fit --bind_all --port 6006
    # Note: Port 6006 mapping removed; handled by Nginx proxy
    volumes:
      - src:/home/jovyan/work

  # NGINX Reverse Proxy
  jupyterlab-proxy:
    image: nginx:latest
    container_name: jupyterlab-proxy
    restart: unless-stopped
    ports:
      - "8888:8888" # Exposes JupyterLab via Nginx
      - "6006:6006" # Exposes TensorBoard via Nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - jupyterlab
      - tensorboard

volumes:
  src:
    driver: local
    driver_opts:
      type: none
      device: /home/alex/src
      o: bind
  gdrive:
    driver: local
    driver_opts:
      type: none
      device: /mnt/gdrive
      o: bind
  jupyter_config:
    driver: local
    driver_opts:
      type: none
      device: /home/alex/docker_server_data/jupyter_config
      o: bind
  huggingface_cache:
    driver: local
    driver_opts:
      type: none
      device: /home/alex/docker_server_data/huggingface_cache
      o: bind
  jetbrains-backend-cache:
    driver: local
    driver_opts:
      type: none
      device: /home/alex/docker_server_data/jetbrains-backend-cache
      o: bind